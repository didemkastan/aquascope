name: PR 607 Windows repair verification

on:
  push:
    branches:
      - verify/pr607-windows-py312
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-repair-verification:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify repair tests on Windows
        run: python -m pytest tests/test_maintenance/test_repair.py -v --tb=short
